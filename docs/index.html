<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQN Interactive Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <h2>🚀 DQN Simulator</h2>
            <div class="control-group">
                <label for="model-select">Model Architecture</label>
                <select id="model-select">
                    <option value="dqn">Basic DQN</option>
                    <option value="double">Double DQN</option>
                    <option value="dueling">Dueling DQN</option>
                    <option value="rainbow">Rainbow DQN</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="mode-select">Environment Mode</label>
                <select id="mode-select">
                    <option value="static">Static Mode</option>
                    <option value="player">Player Mode (Random Start)</option>
                    <option value="random">Random Mode (All Random)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="epsilon-slider">Epsilon (Exploration) <span id="epsilon-val">0.0</span></label>
                <input type="range" id="epsilon-slider" min="0" max="1" step="0.05" value="0">
            </div>

            <div class="control-group">
                <label for="speed-slider">Simulation Speed</label>
                <input type="range" id="speed-slider" min="50" max="1000" step="50" value="300" dir="rtl">
            </div>

            <div class="btn-group">
                <button id="btn-reset" class="btn btn-secondary">Reset Env</button>
                <button id="btn-step" class="btn btn-secondary">Step</button>
                <button id="btn-play" class="btn btn-primary">Auto Play</button>
            </div>
            
            <div class="stats-box">
                <p>Steps: <span id="stat-steps">0</span></p>
                <p>Total Reward: <span id="stat-reward">0.0</span></p>
            </div>
        </aside>

        <!-- Main Display Area -->
        <main class="main-content">
            <div class="grid-container" id="grid">
                <!-- Grid cells generated by JS -->
            </div>
            
            <div class="heatmap-container">
                <h3>State Q-Value Heatmap (V-value)</h3>
                <div class="heatmap-grid" id="heatmap">
                    <!-- Heatmap cells generated by JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
